<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intel — Sustainability Through the Ages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hero -->
  <header class="hero">
    <div class="wordmark" aria-hidden="true">intel<span class="dot"></span></div>
    <h1>Sustainability<br>Through the Ages</h1>
    <div class="rule"></div>
    <p class="hero-sub">From founding to net-zero: nine milestones on Intel's path toward
      a more responsible, resource-conscious future.</p>
  </header>

  <!-- Timeline -->
  <main>
    <section class="timeline-section" aria-label="Sustainability timeline">

      <div class="timeline-scroller">
        <div class="rail" aria-hidden="true"></div>

        <ol class="timeline">

          <li class="card" data-status="done">
            <button class="usb-toggle">
              <span class="usb-connector" aria-hidden="true"></span>
              <span class="usb-shell">
                <span class="usb-led" aria-hidden="true"></span>
                <img class="usb-label" src="https://images.unsplash.com/photo-1675602488453-c3897a475af5?fm=jpg&q=80&w=800&auto=format&fit=crop" alt="Close-up of an integrated circuit board" loading="lazy">
                <span class="usb-plate">
                  <span class="year">1968</span>
                  <span class="title">Intel Founded</span>
                  <span class="desc">Gordon Moore and Robert Noyce found Intel — planting the seed
                    for a company whose environmental footprint would grow alongside the world's
                    need for computing power.</span>
                </span>
              </span>
            </button>
          </li>

          <li class="card" data-status="done">
            <button class="usb-toggle">
              <span class="usb-connector" aria-hidden="true"></span>
              <span class="usb-shell">
                <span class="usb-led" aria-hidden="true"></span>
                <img class="usb-label" src="https://images.pexels.com/photos/9886298/pexels-photo-9886298.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Factory complex with smokestacks, illustrating industrial emissions" loading="lazy">
                <span class="usb-plate">
                  <span class="year">2000</span>
                  <span class="title">Emissions Baseline Set</span>
                  <span class="desc">Intel begins tracking greenhouse gas emissions company-wide,
                    a baseline against which nearly two decades of reduction work would later be
                    measured — cutting Scope 1 &amp; 2 emissions by roughly 31% by 2019.</span>
                </span>
              </span>
            </button>
          </li>

          <li class="card" data-status="done">
            <button class="usb-toggle">
              <span class="usb-connector" aria-hidden="true"></span>
              <span class="usb-shell">
                <span class="usb-led" aria-hidden="true"></span>
                <img class="usb-label" src="https://images.pexels.com/photos/315658/pexels-photo-315658.jpeg?auto=compress&cs=tinysrgb&w=800" alt="A light bulb with a small plant growing inside it, symbolizing conservation" loading="lazy">
                <span class="usb-plate">
                  <span class="year">2012</span>
                  <span class="title">Energy Conservation Push</span>
                  <span class="desc">A new wave of conservation projects begins, ultimately saving
                    more than 4.5 billion kilowatt-hours of electricity by 2020 — enough to power
                    hundreds of thousands of homes for a year.</span>
                </span>
              </span>
            </button>
          </li>

          <li class="card" data-status="done">
            <button class="usb-toggle">
              <span class="usb-connector" aria-hidden="true"></span>
              <span class="usb-shell">
                <span class="usb-led" aria-hidden="true"></span>
                <img class="usb-label" src="https://images.unsplash.com/photo-1508514177221-188b1cf16e9d?fm=jpg&q=80&w=800&auto=format&fit=crop" alt="Solar panel under a clear blue sky" loading="lazy">
                <span class="usb-plate">
                  <span class="year">2019</span>
                  <span class="title">71% Renewable Electricity</span>
                  <span class="desc">Intel reaches 71% renewable electricity across global
                    operations, with European sites already running on 100% clean power.</span>
                </span>
              </span>
            </button>
          </li>

          <li class="card" data-status="done">
            <button class="usb-toggle">
              <span class="usb-connector" aria-hidden="true"></span>
              <span class="usb-shell">
                <span class="usb-led" aria-hidden="true"></span>
                <img class="usb-label" src="https://images.unsplash.com/photo-1586071921485-4c493567232c?fm=jpg&q=80&w=800&auto=format&fit=crop" alt="Wind turbines on a green grass field under blue sky" loading="lazy">
                <span class="usb-plate">
                  <span class="year">2020</span>
                  <span class="title">RISE Strategy Launches</span>
                  <span class="desc">Intel unveils RISE — Responsible, Inclusive, Sustainable,
                    Enabling — formalizing three 2030 goals: net positive water, 100% renewable
                    electricity, and zero waste to landfill.</span>
                </span>
              </span>
            </button>
          </li>

          <li class="card" data-status="done">
            <button class="usb-toggle">
              <span class="usb-connector" aria-hidden="true"></span>
              <span class="usb-shell">
                <span class="usb-led" aria-hidden="true"></span>
                <img class="usb-label" src="https://images.unsplash.com/photo-1509391366360-2e959784a276?fm=jpg&q=80&w=800&auto=format&fit=crop" alt="Solar panels spanning a green field" loading="lazy">
                <span class="usb-plate">
                  <span class="year">2023</span>
                  <span class="title">Net-Zero Pledge</span>
                  <span class="desc">Intel commits to net-zero Scope 1 &amp; 2 greenhouse gas
                    emissions by 2040, while reaching 99% renewable electricity and returning
                    110% of freshwater use in several regions that year.</span>
                </span>
              </span>
            </button>
          </li>

          <li class="card" data-status="goal">
            <button class="usb-toggle">
              <span class="usb-connector" aria-hidden="true"></span>
              <span class="usb-shell">
                <span class="usb-led" aria-hidden="true"></span>
                <img class="usb-label" src="https://images.unsplash.com/photo-1560279966-2d681f3d4dfc?fm=jpg&q=80&w=800&auto=format&fit=crop" alt="Aerial view of a dam releasing water into a river" loading="lazy">
                <span class="usb-plate">
                  <span class="year">2030</span>
                  <span class="title">Goal: Net Positive Water &amp; Full Renewable Power</span>
                  <span class="desc">Target year to conserve 60 billion gallons of water,
                    source 100% renewable electricity, and send zero waste to landfill.</span>
                </span>
              </span>
            </button>
          </li>

          <li class="card" data-status="goal">
            <button class="usb-toggle">
              <span class="usb-connector" aria-hidden="true"></span>
              <span class="usb-shell">
                <span class="usb-led" aria-hidden="true"></span>
                <img class="usb-label" src="https://images.unsplash.com/photo-1466611653911-95081537e5b7?fm=jpg&q=80&w=800&auto=format&fit=crop" alt="Wind turbine on a grass field during golden hour" loading="lazy">
                <span class="usb-plate">
                  <span class="year">2040</span>
                  <span class="title">Goal: Net-Zero Operations</span>
                  <span class="desc">Target to reach net-zero Scope 1 &amp; 2 greenhouse gas
                    emissions across all of Intel's global operations.</span>
                </span>
              </span>
            </button>
          </li>

          <li class="card" data-status="goal">
            <button class="usb-toggle">
              <span class="usb-connector" aria-hidden="true"></span>
              <span class="usb-shell">
                <span class="usb-led" aria-hidden="true"></span>
                <img class="usb-label" src="https://images.unsplash.com/photo-1452179535021-368bb0edc3a8?fm=jpg&q=80&w=800&auto=format&fit=crop" alt="Aerial photo of wind turbines near a field" loading="lazy">
                <span class="usb-plate">
                  <span class="year">2050</span>
                  <span class="title">Goal: Net-Zero Value Chain</span>
                  <span class="desc">Ambitions extend upstream to Scope 3 emissions,
                    reaching net-zero across Intel's full supply chain.</span>
                </span>
              </span>
            </button>
          </li>

        </ol>
      </div>

      <p class="hint">Scroll to explore &nbsp;|&nbsp; Hover or tap a drive to read more</p>

    </section>
  </main>


</body>
</html>
